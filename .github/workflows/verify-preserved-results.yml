name: Verify preserved BET results

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Check saved Hessian restoration
        shell: bash
        run: |
          make hessian-verify
          python3 -m unittest discover -s reproduce -p 'test_hessian.py' -v
          make hessian CASE=diagnostic OUT="$RUNNER_TEMP/bet-hessian"
      - name: Check Make entry points without executing models
        run: python3 ci/check-make-entrypoints.py
      - name: Verify preserved assessment files
        run: python3 ci/verify-preserved-files.py
      - name: Check preserved inputs and results
        shell: bash
        run: |
          ./verify
          make rerun OUT="$RUNNER_TEMP/bet-diagnostic-final"
          unzip -q reproduce/bet-2026-diagnostic-readers.zip -d "$RUNNER_TEMP/diagnostic-kit"
          make --no-print-directory -C "$RUNNER_TEMP/diagnostic-kit/bet-2026-diagnostic-readers" rerun CASE=diagnostic OUT="$RUNNER_TEMP/diagnostic-reader-final"
          python3 ci/verify-preserved-files.py
          git diff --exit-code

  native:
    name: Regenerate saved profiles (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Verify preserved source and native archive
        run: |
          python3 ci/verify-preserved-files.py
          python3 reproduce/restore.py --verify
      - name: Regenerate native outputs and compare original results
        shell: bash
        run: |
          unzip -q reproduce/bet-2026-diagnostic-readers.zip -d "$RUNNER_TEMP/reader-kit"
          kit="$RUNNER_TEMP/reader-kit/bet-2026-diagnostic-readers"
          make --no-print-directory -C "$kit" verify
          Rscript -e 'x <- read.csv(commandArgs(TRUE)[1]); x <- x$case[startsWith(x$case, "profile-")]; stopifnot(length(x) == 45L, !anyDuplicated(x)); cat(x[(seq_along(x)-1L) %% 5L == as.integer(commandArgs(TRUE)[2])], sep="\n")' "$kit/MODELS.csv" "${{ matrix.shard }}" > "$RUNNER_TEMP/profile-cases.txt"
          mkdir "$RUNNER_TEMP/bet-native"
          while IFS= read -r case; do
            make --no-print-directory -C "$kit" profiles CASE="$case" OUT="$RUNNER_TEMP/bet-native/$case"
          done < "$RUNNER_TEMP/profile-cases.txt"
      - name: Confirm source files are unchanged
        run: |
          python3 ci/verify-preserved-files.py
          git diff --exit-code
      - name: Retain numerical verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-diagnostic-native-checks-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/bet-native/*/native-check.csv
            ${{ runner.temp }}/bet-native/*/mfcl-native.log
          if-no-files-found: error
          retention-days: 14

  aspm-reports:
    name: Reproduce both complete original ASPM reports
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Verify original source and compact native files
        run: |
          python3 ci/verify-preserved-files.py
          python3 reproduce/restore.py --verify
      - name: Reproduce both original complete REP files
        run: |
          unzip -q reproduce/bet-2026-diagnostic-readers.zip -d "$RUNNER_TEMP/aspm-kit"
          make --no-print-directory -C "$RUNNER_TEMP/aspm-kit/bet-2026-diagnostic-readers" aspm CASE=constant OUT="$RUNNER_TEMP/aspm-constant"
          make --no-print-directory -C "$RUNNER_TEMP/aspm-kit/bet-2026-diagnostic-readers" aspm CASE=fitted OUT="$RUNNER_TEMP/aspm-fitted"
          python3 ci/verify-preserved-files.py
          git diff --exit-code
      - name: Retain replay verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspm-report-replay-checks
          path: |
            ${{ runner.temp }}/aspm-constant/native-check.csv
            ${{ runner.temp }}/aspm-fitted/native-check.csv
            ${{ runner.temp }}/aspm-constant/mfcl-native.log
            ${{ runner.temp }}/aspm-fitted/mfcl-native.log
          if-no-files-found: error
          retention-days: 14
