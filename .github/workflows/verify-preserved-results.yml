name: Verify preserved BET results

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check saved Hessian restoration
        shell: bash
        run: |
          make hessian-verify
          python3 -m unittest discover -s reproduce -p 'test_hessian.py' -v
          make hessian CASE=diagnostic OUT="$RUNNER_TEMP/bet-hessian"
      - name: Check Make entry points without executing models
        run: python3 ci/check-make-entrypoints.py
      - name: Verify preserved assessment files
        run: python3 ci/verify-preserved-files.py
      - name: Check preserved inputs and results
        shell: bash
        run: |
          ./verify
          make rerun OUT="$RUNNER_TEMP/bet-diagnostic-final"
          python3 ci/verify-preserved-files.py
          git diff --exit-code

  native:
    name: Regenerate saved profile and ASPM fits
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify preserved source and native archive
        run: |
          python3 ci/verify-preserved-files.py
          python3 reproduce/restore.py --verify
      - name: Regenerate native outputs and compare original results
        run: python3 reproduce/run-native.py available "$RUNNER_TEMP/bet-native"
      - name: Confirm source files are unchanged
        run: |
          python3 ci/verify-preserved-files.py
          git diff --exit-code
      - name: Retain numerical verification receipts
        uses: actions/upload-artifact@v4
        with:
          name: saved-diagnostic-native-checks
          path: |
            ${{ runner.temp }}/bet-native/native-checks.json
            ${{ runner.temp }}/bet-native/*/native-check.json
          if-no-files-found: error
          retention-days: 14

  aspm-reports:
    name: Reproduce both complete original ASPM reports
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify original source and compact native files
        run: |
          python3 ci/verify-preserved-files.py
          python3 reproduce/restore.py --verify
      - name: Reproduce both original complete REP files
        run: |
          python3 reproduce/replay-aspm.py constant "$RUNNER_TEMP/aspm-constant"
          python3 reproduce/replay-aspm.py fitted "$RUNNER_TEMP/aspm-fitted"
          python3 ci/verify-preserved-files.py
          git diff --exit-code
      - name: Retain replay verification receipts
        uses: actions/upload-artifact@v4
        with:
          name: aspm-report-replay-checks
          path: |
            ${{ runner.temp }}/aspm-constant/native-check.json
            ${{ runner.temp }}/aspm-fitted/native-check.json
          if-no-files-found: error
          retention-days: 14
