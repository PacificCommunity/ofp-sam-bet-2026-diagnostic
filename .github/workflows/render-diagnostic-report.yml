name: Render BET 2026 Diagnostic report

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "diagnostic-report/**"
      - "results/reference/**"
      - ".github/workflows/render-diagnostic-report.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    container:
      image: ghcr.io/pacificcommunity/tuna-flow-private:v2.7@sha256:4fee4c40cb6439ff920b1dd233a84bf19d5cc0e37278c99ceff3fd79cb9c8852
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify TunaFlow 2.7 report runtime
        run: |
          Rscript -e 'required <- c("FLR4MFCL", "mfclkit", "mfclshiny", "ggplot2", "patchwork", "jsonlite", "ragg", "htmltools", "plotly", "htmlwidgets"); stopifnot(all(vapply(required, requireNamespace, logical(1), quietly = TRUE)))'
          pdflatex --version | head -n 1

      - name: Validate viewer template
        run: |
          sha256sum -c diagnostic-report/data/SHA256SUMS
          Rscript diagnostic-report/tests/test-public-payload.R
          Rscript diagnostic-report/tests/test-likelihood-profile-viewer.R

      - name: Render public Diagnostic report
        run: bash diagnostic-report/run.sh

      - name: Verify self-contained report, viewer and PNG outputs
        shell: bash
        run: |
          test -s diagnostic-report-output/bet-2026-diagnostic-report.html
          test -s diagnostic-report-output/viewer/bet-2026-likelihood-profile-viewer.html
          test -s diagnostic-report-output/report-manifest.csv
          test -s diagnostic-report-output/tables/tag-attrition-validation.csv
          test -s diagnostic-report-output/tables/parameter-bounds.csv
          test -s diagnostic-report-output/tables/parameter-correlations.csv
          test "$(find diagnostic-report-output -path '*/figures/*.png' -type f | wc -l)" -ge 20
          grep -q 'data:image/png;base64,' diagnostic-report-output/bet-2026-diagnostic-report.html
          grep -q 'pacificcommunity.github.io/ofp-sam-bet-2026-diagnostic/bet-2026-likelihood-profile-viewer.html' diagnostic-report-output/bet-2026-diagnostic-report.html
          grep -q 'Number of nodes' diagnostic-report-output/bet-2026-diagnostic-report.html
          grep -q 'CAAL regions' diagnostic-report-output/viewer/bet-2026-likelihood-profile-viewer.html
          grep -q 'Region 1 CAAL fisheries' diagnostic-report-output/viewer/bet-2026-likelihood-profile-viewer.html
          grep -q 'LF region totals' diagnostic-report-output/viewer/bet-2026-likelihood-profile-viewer.html
          grep -q 'Region 1 LF fisheries' diagnostic-report-output/viewer/bet-2026-likelihood-profile-viewer.html
          grep -q 'Tag programme totals' diagnostic-report-output/viewer/bet-2026-likelihood-profile-viewer.html
          grep -q 'RTTP release groups' diagnostic-report-output/viewer/bet-2026-likelihood-profile-viewer.html
          grep -q 'Chart added below the broad-component chart' diagnostic-report-output/viewer/bet-2026-likelihood-profile-viewer.html
          grep -q 'Total average biomass (10³ t)' diagnostic-report-output/viewer/bet-2026-likelihood-profile-viewer.html
          Rscript - <<'RS'
          viewer_file <- "diagnostic-report-output/viewer/bet-2026-likelihood-profile-viewer.html"
          viewer_html <- paste(readLines(viewer_file, warn = FALSE), collapse = "\n")
          payload_match <- regexec(
            '<script id="viewer-data" type="application/json">(.*?)</script>',
            viewer_html, perl = TRUE
          )
          payload_parts <- regmatches(viewer_html, payload_match)[[1L]]
          stopifnot(length(payload_parts) == 2L)
          payload <- jsonlite::fromJSON(payload_parts[[2L]], simplifyVector = FALSE)
          root_details <- Filter(function(group) {
            identical(group$kind, "detail") &&
              is.null(group$parent_group) && is.null(group$parent_profile)
          }, payload$groups)
          stopifnot(length(root_details) >= 5L)
          RS
          grep -q 'von Bertalanffy growth-rate parameter (κ)' diagnostic-report-output/bet-2026-diagnostic-report.html
          grep -q 'MFCL flagged 38 parameters' diagnostic-report-output/bet-2026-diagnostic-report.html
          ! grep -q 'Relative total average biomass' diagnostic-report-output/viewer/bet-2026-likelihood-profile-viewer.html
          ! grep -q 'Total average biomass / fitted value' diagnostic-report-output/viewer/bet-2026-likelihood-profile-viewer.html
          ! grep -q 'Weight frequency' diagnostic-report-output/bet-2026-diagnostic-report.html
          ! grep -q 'Weight frequency' diagnostic-report-output/viewer/bet-2026-likelihood-profile-viewer.html
          ! grep -Eq "src=['\"](figures|mfclshiny)/" diagnostic-report-output/bet-2026-diagnostic-report.html
          ! grep -q 'releases/latest/download/bet-2026-likelihood-profile-viewer.html' diagnostic-report-output/bet-2026-diagnostic-report.html

      - name: Prepare GitHub Pages root
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          install -m 0644 diagnostic-report-output/viewer/bet-2026-likelihood-profile-viewer.html diagnostic-report-output/index.html
          install -m 0644 diagnostic-report-output/viewer/bet-2026-likelihood-profile-viewer.html diagnostic-report-output/bet-2026-likelihood-profile-viewer.html

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: bet-2026-diagnostic-report
          path: diagnostic-report-output/
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: diagnostic-report-output

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bet-2026-diagnostic-report
          path: release/report
      - name: Build report bundle
        run: (cd release/report && zip -q -r ../bet-2026-diagnostic-report-${{ github.ref_name }}.zip .)
      - name: Publish report release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/report/viewer/bet-2026-likelihood-profile-viewer.html
            release/report/bet-2026-diagnostic-report.html
            release/report/report-manifest.csv
            release/bet-2026-diagnostic-report-${{ github.ref_name }}.zip
