name: Validate Diagnostic model

on:
  push:
    branches: [main, tau2-exploration]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify frozen files
        run: ./verify
      - name: Check scripts
        run: |
          sh -n doitall run-final restore-hessian verify scripts/run-model scripts/validate-selectivity-models model/doitall.sh standalone/run-final
          bash -n scripts/container-run run.sh diagnostic-report/run.sh
          python -m py_compile diagnostic-report/submit.py
      - name: Confirm Job 21641 controls
        run: |
          test "$(awk '/^# sv[(]29[)]/ { getline; print $1; exit }' model/bet.ini)" = 0.90
          ! grep -Ev '^[[:space:]]*#' model/doitall.sh | grep -Eiq 'seed.?23|checkpoint|doitall-core'
          grep -F '1 305 1' model/doitall.sh
          grep -F '1 306 0' model/doitall.sh
          grep -F -- '-999 43 0' model/doitall.sh
          grep -F -- '-999 44 0' model/doitall.sh
          test "$(grep -c '^audit_tau2_fixed [0-9][0-9]\.par' model/doitall.sh)" -eq 11
      - name: Set up R for payload validation
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
      - name: Install mfclshiny payload builder
        run: |
          Rscript -e 'install.packages("remotes", repos="https://cloud.r-project.org")'
          Rscript -e 'remotes::install_github("PacificCommunity/mfclshiny@diagnostic-caption-polish-latest", dependencies=TRUE, upgrade="never")'
      - name: Evaluate the reference final PAR
        run: ./run-final
      - name: Confirm the reference objective
        run: grep -F "Total func      90814.857396659" final-run/mfcl-final.log
      - name: Confirm Job 21641 diagnostics were restored
        run: |
          test -s final-run/hessian/hessian_info.rds
          test -s final-run/hessian/check-summary.csv
          test -s final-run/hessian/check-unit-status.csv
          test -s final-run/model_payload.rds
