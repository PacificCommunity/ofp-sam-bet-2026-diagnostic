name: bet-2026-mfclrtmb-mcmc-chain
description: Run one reusable mfclrtmb SparseNUTS chain from a Kflow model job, with an optional matching native-Hessian preconditioner.
command: bash mcmc/inst/kflow/run-mfclrtmb-mcmc-chain.sh
docker_image: ghcr.io/pacificcommunity/tuna-flow@sha256:7b9dc95f535025a42109ac958c4faa3af96592cd19510ac0be15af4478eccf27
remote_host: suva
remote_user: kyuhank
remote_base_dir: /home/kyuhank/KflowOutput
slot_requirements: 'regexp("^suvofp", Machine)'
resources:
  cpus: 1
  memory: 16GB
  disk: 30GB
exclude_machines: []
exclude_slots: []
input_jobs: []
env:
  MFCLRTMB_TARBALL: mcmc/vendor/mfclrtmb_0.3.2.tar.gz
  MFCLRTMB_SHA256: 852368b0084f5881577625bf89a571e9dc6218d5567bc7371b5403b60999bfcb
  MCMC_SOURCE_JOB: ""
  MCMC_MODEL_SELECTOR: ""
  MCMC_ROOT: ""
  MCMC_PRECONDITIONER: adaptive
  MCMC_OBJECTIVE_TOLERANCE: "0.0001"
  MCMC_CHAIN_ID: "1"
  MCMC_TOTAL_CHAINS: "10"
  MCMC_WARMUP: "100"
  MCMC_SAMPLES: "20"
  MCMC_ADAPT_DELTA: "0.9"
  MCMC_MAX_TREEDEPTH: "10"
  MCMC_SEED: "20260728"
tags:
  stage: mcmc
  species: BET
  assessment_year: "2026"
  engine: mfclrtmb
  sampler: SparseNUTS
  site: suva
output_patterns:
  - outputs/**
metadata:
  job_config:
    optional:
      - MCMC_SOURCE_JOB
      - MCMC_MODEL_SELECTOR
      - MCMC_ROOT
      - MCMC_PRECONDITIONER
      - MCMC_OBJECTIVE_TOLERANCE
      - MCMC_CHAIN_ID
      - MCMC_TOTAL_CHAINS
      - MCMC_WARMUP
      - MCMC_SAMPLES
      - MCMC_ADAPT_DELTA
      - MCMC_MAX_TREEDEPTH
      - MCMC_SEED
      - MFCLRTMB_TARBALL
      - MFCLRTMB_SHA256
      - BASE_MODEL_JOB
      - MODEL_BASE_INPUT_JOB
      - ATTACH_OUTPUT_MODE
