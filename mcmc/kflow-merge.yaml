name: bet-2026-mfclrtmb-mcmc-merge
description: Merge reusable mfclrtmb SparseNUTS chain jobs and produce posterior diagnostics, key quantities, plots, and an HTML report.
command: bash mcmc/inst/kflow/merge-mfclrtmb-mcmc.sh
docker_image: ghcr.io/pacificcommunity/tuna-flow@sha256:7b9dc95f535025a42109ac958c4faa3af96592cd19510ac0be15af4478eccf27
remote_host: suva
remote_user: kyuhank
remote_base_dir: /home/kyuhank/KflowOutput
slot_requirements: 'regexp("^suvofp", Machine)'
resources:
  cpus: 2
  memory: 16GB
  disk: 30GB
exclude_machines: []
exclude_slots: []
input_jobs: []
env:
  MCMC_SOURCE_JOB: ""
  MCMC_TOTAL_CHAINS: "10"
  MCMC_WARMUP: "100"
  MCMC_SAMPLES: "20"
  MCMC_ADAPT_DELTA: "0.9"
  MCMC_MAX_TREEDEPTH: "10"
tags:
  stage: mcmc
  species: BET
  assessment_year: "2026"
  engine: mfclrtmb
  sampler: SparseNUTS
  site: suva
output_patterns:
  - outputs/**
metadata:
  job_config:
    optional:
      - MCMC_SOURCE_JOB
      - MCMC_TOTAL_CHAINS
      - MCMC_WARMUP
      - MCMC_SAMPLES
      - MCMC_ADAPT_DELTA
      - MCMC_MAX_TREEDEPTH
      - BASE_MODEL_JOB
      - MODEL_BASE_INPUT_JOB
      - ATTACH_OUTPUT_MODE
