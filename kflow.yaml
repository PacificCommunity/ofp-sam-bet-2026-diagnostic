name: ofp-sam-bet-2026-diagnostic-tau2-exploration
description: Fit the BET 2026 Diagnostic configuration with tag tau fixed at 2 and ordinary makepar initialization.
command: bash run.sh
docker_image: ghcr.io/pacificcommunity/tuna-flow:v2.5@sha256:c87f1f6d9d4f62dc447844b58afe35f96af175bf933cb6cffbbbe39a59172360
remote_host: suva
remote_user: kyuhank
remote_base_dir: /home/kyuhank/KflowOutput
slot_requirements: 'regexp("^suvofp", Machine)'
resources:
  cpus: 2
  memory: 8GB
  disk: 20GB
exclude_machines: []
exclude_slots: []
env:
  JOB_TITLE: Diagnostic model | tau fixed at 2
  JOB_DESCRIPTION: Diagnostic settings with direct negative-binomial tau fixed at 2; standard makepar initialization and no seed-23 checkpoint.
  MODEL_LABEL: Diagnostic model | tau fixed at 2
  JOB_KEY: diagnostic-model-tau2-fixed
  FLOW_GROUP: bet-2026-diagnostic-tau2-exploration
  FLOW_SPECIES: BET
  FLOW_SPECIES_LABEL: bigeye tuna
  FLOW_ASSESSMENT_YEAR: "2026"
  PROGRAM_PATH: /home/mfcl/mfclo64
  BET_PHASE10_11_CONVERGENCE: "-4"
  TUNA_FLOW_RUNTIME_UPDATE: never
tags:
  stage: tau2-exploration
  species: BET
  assessment_year: "2026"
output_patterns:
  - outputs/**
metadata:
  public_reproducible_model: true
  initialization: ordinary-makepar
  fixed_tau: "2"
  parest_305: "1"
  fish_pars_4: "0"
  fish_flag_43: "0"
  model_label: Diagnostic model | tau fixed at 2
