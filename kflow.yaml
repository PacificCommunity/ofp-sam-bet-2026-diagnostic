name: ofp-sam-bet-2026-diagnostic
description: Reproduce the public BET 2026 Diagnostic model from frozen Job 19835 inputs.
command: bash run.sh
docker_image: ghcr.io/pacificcommunity/tuna-flow:v2.5@sha256:c87f1f6d9d4f62dc447844b58afe35f96af175bf933cb6cffbbbe39a59172360
remote_host: suva
remote_user: kyuhank
remote_base_dir: /home/kyuhank/KflowOutput
slot_requirements: 'regexp("^suvofp", Machine)'
resources:
  cpus: 2
  memory: 8GB
  disk: 20GB
exclude_machines: []
exclude_slots: []
env:
  JOB_TITLE: Diagnostic model
  JOB_DESCRIPTION: Public standalone reconstruction of BET 2026 Kflow Job 19835.
  MODEL_LABEL: Diagnostic model
  JOB_KEY: diagnostic-model
  FLOW_GROUP: bet-2026-diagnostic
  FLOW_SPECIES: BET
  FLOW_SPECIES_LABEL: bigeye tuna
  FLOW_ASSESSMENT_YEAR: "2026"
  PROGRAM_PATH: /home/mfcl/mfclo64
  BET_PHASE10_11_CONVERGENCE: "-4"
  TUNA_FLOW_RUNTIME_UPDATE: never
tags:
  stage: diagnostic-model
  species: BET
  assessment_year: "2026"
  source_job: "19835"
output_patterns:
  - outputs/**
metadata:
  public_reproducible_model: true
  source_job: "19835"
  source_seed: "23"
  model_label: Diagnostic model
